{% extends "base.html" %}
{% block content %}
<h2>Yeni Tədbir Yarat</h2>
<form method="POST" class="w-50">
    <div class="mb-3">
        <label class="form-label">Tədbir Adı</label>
        <input type="text" name="title" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Təsviri</label>
        <textarea name="description" class="form-control" required></textarea>
    </div>
    <div class="mb-3">
        <label class="form-label">Kateqoriya</label>
        <select name="category_id" class="form-select" required>
            {% for cat in categories %}
                <option value="{{ cat.id }}">{{ cat.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Tarix (YYYY-MM-DD)</label>
        <input type="date" name="date" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Saat (HH:MM)</label>
        <input type="time" name="time" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Keçirilmə Yeri</label>
        <input type="text" name="location" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Maksimum İştirakçı Sayı</label>
        <input type="number" name="max_participants" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-success">Tədbiri Yarat</button>
</form>
{% endblock %}
