<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Universitet Tədbirləri Sistemi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">UniEvents</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{{ url_for('index') }}">Statistika (Ana səhifə)</a>
                <a class="nav-link" href="{{ url_for('events_list') }}">Tədbirlər və Axtarış</a>
                <a class="nav-link" href="{{ url_for('create_event') }}">Yeni Tədbir yarat</a>
            </div>
        </div>
    </nav>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
